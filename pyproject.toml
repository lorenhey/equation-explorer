[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "equation-explorer"
version = "1.0.0"
description = "A computable mathematical knowledge graph for exploring and solving physics equations."
authors = [
    {name = "Loren", email = "loren@example.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sympy>=1.12",
    "pint>=0.22",
    "networkx>=3.1",
    "pydantic>=2.4",
    "pyyaml>=6.0",
    "typer>=0.9",
    "rich>=13.0",
    "streamlit>=1.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black",
    "ruff"
]

[project.scripts]
eqx = "equation_explorer.cli.main:app"

[tool.setuptools]
packages = ["equation_explorer"]
