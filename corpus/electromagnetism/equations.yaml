equations:
- id: ohms_law
  name:
    en: ohm's Law
  expression: V - I*R
  variables:
    V:
      quantity: voltage
    I:
      quantity: current
    R:
      quantity: resistance
  assumptions: []
  derives_from: []
  domain: Electromagnetism
