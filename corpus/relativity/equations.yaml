equations:
- id: mass_energy_equivalence
  name:
    en: Mass-Energy Equivalence
  expression: E - m*c**2
  variables:
    E:
      quantity: energy
    m:
      quantity: mass
    c:
      quantity: speed_of_light
  assumptions:
  - flat_spacetime
  derives_from: []
  domain: Relativity
- id: lorentz_factor_def
  name:
    en: Lorentz Factor
  expression: gamma - 1 / sqrt(1 - v**2/c**2)
  variables:
    gamma:
      quantity: lorentz_factor
    v:
      quantity: velocity
    c:
      quantity: speed_of_light
  assumptions:
  - flat_spacetime
  derives_from: []
  domain: Relativity
