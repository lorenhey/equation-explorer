equations:
- id: ideal_gas_law
  name:
    en: Ideal Gas Law
  expression: P*V - n*R*T
  variables:
    P:
      quantity: pressure
    V:
      quantity: volume
    n:
      quantity: moles
    T:
      quantity: temperature
    R:
      quantity: gas_constant
  assumptions:
  - ideal_gas
  derives_from: []
  domain: Thermodynamics
- id: first_law
  name:
    en: First Law of Thermodynamics
  expression: Delta_U - (Q - W)
  variables:
    Delta_U:
      quantity: internal_energy
    Q:
      quantity: heat
    W:
      quantity: work
  assumptions: []
  derives_from: []
  domain: Thermodynamics
- id: enthalpy_def
  name:
    en: Enthalpy Definition
  expression: H - (U + P*V)
  variables:
    H:
      quantity: enthalpy
    U:
      quantity: internal_energy
    P:
      quantity: pressure
    V:
      quantity: volume
  assumptions: []
  derives_from: []
  domain: Thermodynamics
- id: gibbs_def
  name:
    en: Gibbs Free Energy Definition
  expression: G - (H - T*S)
  variables:
    G:
      quantity: gibbs_free_energy
    H:
      quantity: enthalpy
    T:
      quantity: temperature
    S:
      quantity: entropy
  assumptions: []
  derives_from:
  - enthalpy_def
  domain: Thermodynamics
- id: helmholtz_def
  name:
    en: Helmholtz Free Energy Definition
  expression: A - (U - T*S)
  variables:
    A:
      quantity: helmholtz_free_energy
    U:
      quantity: internal_energy
    T:
      quantity: temperature
    S:
      quantity: entropy
  assumptions: []
  derives_from: []
  domain: Thermodynamics
